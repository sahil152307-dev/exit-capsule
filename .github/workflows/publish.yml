name: Publish to PyPI

on:
  release:
    types: [published]   # Triggers ONLY when you create a GitHub Release

jobs:
  build-and-publish:
    name: Build & Publish exit-capsule to PyPI
    runs-on: ubuntu-latest
    environment: pypi-release          # Optional: add a "pypi-release" env in GitHub Settings for extra protection
    permissions:
      id-token: write                  # Required for trusted publishing (no API token needed)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build source distribution and wheel
        run: python -m build

      - name: Check dist files
        run: twine check dist/*

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No API token needed if you set up Trusted Publisher on PyPI
        # Otherwise uncomment the next two lines and add PYPI_API_TOKEN secret in GitHub:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

