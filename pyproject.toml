[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exit-capsule"
version = "1.0.0"
description = "Production-ready local Python CLI tool for repository dependency analysis, AST import mapping, test verification, and AI migration planning."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Sahil"}
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "google-genai>=2.0.0",
    "pytest>=7.0.0",
    "packaging>=22.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
exit-capsule = "exit_capsule.cli:app"

[tool.setuptools.packages.find]
include = ["exit_capsule*"]
exclude = ["tests*"]
